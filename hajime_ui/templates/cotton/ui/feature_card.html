<c-vars icon="" title="" description="" class="" />

<div class="group relative bg-white rounded-2xl p-8 border border-gray-100
            hover:shadow-xl hover:-translate-y-1
            transition-all duration-300 ease-out {{ class }}"
     {{ attrs }}>

  {% if icon %}
    <div class="text-4xl mb-5 select-none
                group-hover:scale-110 transition-transform duration-300">
      {{ icon|safe }}
    </div>
  {% endif %}

  {% if title %}
    <h3 class="text-lg font-semibold text-gray-900 mb-3">{{ title }}</h3>
  {% endif %}

  {% if description %}
    <p class="text-gray-600 text-sm leading-relaxed">{{ description }}</p>
  {% endif %}

  {% if slot %}
    <div class="mt-4">{{ slot }}</div>
  {% endif %}
</div>
