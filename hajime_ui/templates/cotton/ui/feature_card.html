<c-vars icon="" title="" description="" class="" />

<div class="group relative bg-white/80 rounded-3xl p-8 border border-stone-200/70 shadow-xs
            hover:shadow-xl hover:-translate-y-1.5 hover:border-vermillon/30
            transition-all duration-300 ease-out {{ class }}"
     {{ attrs }}>

  {% if icon %}
    <div class="w-14 h-14 rounded-2xl bg-washi/80 flex items-center justify-center text-3xl mb-6 select-none
                group-hover:scale-110 group-hover:bg-vermillon/10 transition-all duration-300">
      {{ icon|safe }}
    </div>
  {% endif %}

  {% if title %}
    <h3 class="text-xl font-bold text-stone-900 mb-3 group-hover:text-vermillon transition-colors">
      {{ title }}
    </h3>
  {% endif %}

  {% if description %}
    <p class="text-stone-600 text-sm leading-relaxed">{{ description }}</p>
  {% endif %}

  {% if slot %}
    <div class="mt-6">{{ slot }}</div>
  {% endif %}
</div>
