<c-vars action="" method="post" title="" subtitle="" class="" />

<div class="bg-white rounded-2xl border border-gray-100 p-8 sm:p-10 {{ class }}"
     {{ attrs }}>

  {% if title or subtitle %}
    <div class="mb-8">
      {% if title %}
        <h2 class="text-2xl font-bold text-gray-900">{{ title }}</h2>
      {% endif %}
      {% if subtitle %}
        <p class="mt-2 text-sm text-gray-500">{{ subtitle }}</p>
      {% endif %}
    </div>
  {% endif %}

  <form action="{{ action }}" method="{{ method }}"
        class="space-y-6"
        {{ form_attrs }}>

    {% csrf_token %}

    {{ slot }}

  </form>
</div>
