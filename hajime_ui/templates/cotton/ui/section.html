<c-vars title="" subtitle="" id="" bg_class="" class="" />

<section {% if id %}id="{{ id }}"{% endif %}
         class="py-20 sm:py-28 lg:py-32 relative overflow-hidden {{ bg_class }} {{ class }}"
         {{ attrs }}>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

    {% if title or subtitle %}
      <div class="text-center max-w-3xl mx-auto mb-16 sm:mb-20">
        {% if title %}
          <h2 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight text-stone-900 leading-tight">
            {{ title|safe }}
          </h2>
          <div class="divider-brush my-6"></div>
        {% endif %}
        {% if subtitle %}
          <p class="text-lg text-stone-600 leading-relaxed">
            {{ subtitle|safe }}
          </p>
        {% endif %}
      </div>
    {% endif %}

    {{ slot }}
  </div>
</section>
