<c-vars title="" subtitle="" id="" bg_class="" class="" />

<section {% if id %}id="{{ id }}"{% endif %}
         x-data="{ visible: false }"
         x-intersect:enter="visible = true"
         class="py-20 sm:py-28 {{ bg_class }} {{ class }}"
         {{ attrs }}>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8"
       :class="visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'"
       style="transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);">

    {% if title or subtitle %}
      <div class="text-center mb-16">
        {% if title %}
          <h2 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
            {{ title|safe }}
          </h2>
        {% endif %}
        {% if subtitle %}
          <p class="mt-4 text-lg text-gray-600 max-w-2xl mx-auto">
            {{ subtitle|safe }}
          </p>
        {% endif %}
      </div>
    {% endif %}

    {{ slot }}
  </div>
</section>
