<c-vars quote="" author="" role="" avatar_url="" class="" />

<div class="bg-white rounded-2xl p-8 border border-gray-100
            hover:shadow-lg transition-shadow duration-300 {{ class }}"
     {{ attrs }}>

  <!-- Quote mark -->
  <div class="text-4xl text-gray-200 font-serif leading-none mb-4 select-none">"</div>

  {% if quote %}
    <blockquote class="text-gray-700 leading-relaxed mb-6">
      {{ quote }}
    </blockquote>
  {% elif slot %}
    <blockquote class="text-gray-700 leading-relaxed mb-6">
      {{ slot }}
    </blockquote>
  {% endif %}

  <div class="flex items-center gap-3 pt-4 border-t border-gray-100">
    {% if avatar_url %}
      <img src="{{ avatar_url }}" alt="{{ author }}"
           class="w-10 h-10 rounded-full object-cover" />
    {% else %}
      <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm font-semibold">
        {{ author|truncatechars:2 }}
      </div>
    {% endif %}
    <div>
      {% if author %}
        <p class="font-semibold text-sm text-gray-900">{{ author }}</p>
      {% endif %}
      {% if role %}
        <p class="text-xs text-gray-500">{{ role }}</p>
      {% endif %}
    </div>
  </div>
</div>
