<c-vars brand="" brand_href="/" class="" />

<nav x-data="{ open: false }"
     class="fixed top-0 inset-x-0 z-50 backdrop-blur-md bg-white/80 border-b border-gray-100 transition-all duration-300 {{ class }}"
     {{ attrs }}>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Brand -->
      <a href="{{ brand_href }}" class="flex items-center gap-2 text-lg font-bold tracking-tight text-gray-900 hover:opacity-80 transition-opacity">
        {{ brand|safe }}
      </a>

      <!-- Desktop nav links -->
      <div class="hidden md:flex items-center gap-1">
        {{ slot }}
      </div>

      <!-- Desktop actions -->
      {% if actions %}
        <div class="hidden md:flex items-center gap-3">
          {{ actions }}
        </div>
      {% endif %}

      <!-- Mobile hamburger -->
      <button type="button"
              @click="open = !open"
              class="md:hidden inline-flex items-center justify-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors focus:outline-none"
              :aria-expanded="open">
        <svg x-show="!open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg x-show="open" x-cloak class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-2"
       class="md:hidden border-t border-gray-100 bg-white/95 backdrop-blur-md">
    <div class="px-4 py-4 space-y-1">
      {{ slot }}
    </div>
    {% if actions %}
      <div class="px-4 pb-4 pt-2 border-t border-gray-100 flex flex-col gap-2">
        {{ actions }}
      </div>
    {% endif %}
  </div>
</nav>
