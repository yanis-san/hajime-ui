<c-vars brand="" brand_href="/" class="" />

<nav x-data="{ open: false }"
     class="fixed top-0 inset-x-0 z-50 glass-nav transition-all duration-300 {{ class }}"
     {{ attrs }}>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">

      <!-- Brand -->
      <a href="{{ brand_href }}" class="flex items-center gap-3 group focus:outline-none">
        {{ brand|safe }}
      </a>

      <!-- Desktop Navigation Links -->
      <div class="hidden md:flex items-center gap-2">
        {{ slot }}
      </div>

      <!-- Desktop Actions (Language Switcher + CTA) -->
      {% if actions %}
        <div class="hidden md:flex items-center gap-4">
          {{ actions }}
        </div>
      {% endif %}

      <!-- Mobile Hamburger Button -->
      <button type="button"
              @click="open = !open"
              class="md:hidden inline-flex items-center justify-center p-2.5 rounded-xl text-stone-700 hover:text-vermillon hover:bg-stone-100/80 transition-colors focus:outline-none"
              :aria-expanded="open"
              aria-label="Toggle Navigation">
        <svg x-show="!open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg x-show="open" x-cloak class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-4"
       class="md:hidden border-t border-stone-200/60 bg-cream/98 backdrop-blur-2xl shadow-xl">
    <div class="px-6 py-6 space-y-3">
      {{ slot }}
    </div>
    {% if actions %}
      <div class="px-6 pb-6 pt-4 border-t border-stone-200/60 flex flex-col gap-3">
        {{ actions }}
      </div>
    {% endif %}
  </div>
</nav>
