<c-vars brand="" brand_href="/" class="" />

<!-- Modern Clean Navbar (Full-Width Sticky Glass Header) -->
<header x-data="{ open: false, scrolled: false }"
        @scroll.window="scrolled = (window.pageYOffset > 10)"
        class="fixed top-0 inset-x-0 z-50 transition-all duration-200 {{ class }}"
        {{ attrs }}>
  
  <div class="w-full bg-white/85 backdrop-blur-xl border-b transition-all duration-200"
       :class="scrolled ? 'border-stone-300/80 shadow-md bg-white/95 py-3' : 'border-stone-200/60 py-4'">
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">

      <!-- Left: Logo & Brand -->
      <a href="{{ brand_href }}" class="flex items-center gap-3 shrink-0 group focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-vermillon to-vermillon-dark text-white flex items-center justify-center font-bold text-lg shadow-md shadow-vermillon/20 group-hover:scale-105 transition-transform">
          学
        </div>
        <div class="flex flex-col">
          <span class="font-display text-xl font-extrabold text-stone-900 leading-none">
            {% if brand %}{{ brand|safe }}{% else %}Yanis-san{% endif %}
          </span>
          <span class="text-[10px] font-bold text-vermillon uppercase tracking-wider mt-0.5">
            日本語の授業
          </span>
        </div>
      </a>

      <!-- Center: Desktop Links (Visible on md and up: >= 768px) -->
      <nav class="hidden md:flex items-center gap-1 bg-stone-100/80 p-1.5 rounded-full border border-stone-200/70">
        {{ slot }}
      </nav>

      <!-- Right: Actions (Language Switcher & CTA) -->
      {% if actions %}
        <div class="hidden md:flex items-center gap-3">
          {{ actions }}
        </div>
      {% endif %}

      <!-- Mobile Hamburger Button (< 768px) -->
      <button type="button"
              @click="open = !open"
              class="md:hidden inline-flex items-center justify-center p-2.5 rounded-xl text-stone-800 hover:text-vermillon hover:bg-stone-100 transition-colors focus:outline-none"
              :aria-expanded="open"
              aria-label="Menu Navigation">
        <svg x-show="!open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg x-show="open" x-cloak class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-2"
       class="md:hidden border-b border-stone-200 bg-white/98 backdrop-blur-2xl shadow-2xl px-6 py-6 space-y-4">
    <div class="flex flex-col gap-2">
      {{ slot }}
    </div>
    {% if actions %}
      <div class="pt-4 border-t border-stone-100 flex flex-col gap-3">
        {{ actions }}
      </div>
    {% endif %}
  </div>
</header>
